<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Jusqu'au premier matin">
  <title>Jusqu'au premier matin</title>
  <defs>
    <linearGradient id="ciel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16202c"/>
      <stop offset="0.55" stop-color="#1f2b38"/>
      <stop offset="1" stop-color="#b27d36"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#ciel)"/>
  <!-- toits : la ville, la nuit -->
  <path d="M4 46h9v-7h7v7h6v-11h8v11h6v-6h8v6h12v14H4z" fill="#0e151d"/>
  <!-- la fenêtre allumée : la seule lumière -->
  <rect x="29" y="39" width="5" height="5" fill="#e8c078"/>
  <!-- le matin qui vient -->
  <path d="M4 46h56" stroke="#e8c078" stroke-width="2" stroke-linecap="round"/>
</svg>
